name: Desktop builds
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build:ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - if: runner.os == 'Windows'
        run: npm run build -- --no-bundle
      - if: runner.os == 'macOS'
        run: npm run build -- --bundles app
      - if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/before-you-do.app" artifacts/before-you-do-mac.zip
      - if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/package-windows-release.ps1 -Tag '${{ github.ref_name }}'
      - if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCH=apple-silicon
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then ARCH=intel; fi
          cp artifacts/before-you-do-mac.zip "artifacts/before-you-do-${RELEASE_TAG}-macos-${ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: before-you-do-${{ matrix.os }}
          path: |
            src-tauri/target/release/before-you-do.exe
            artifacts/before-you-do-mac.zip
            artifacts/before-you-do-v*-*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: before-you-do-*
          path: artifacts/downloaded
      - name: Collect and verify all platform archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts/release
          find artifacts/downloaded -type f -name "before-you-do-${RELEASE_TAG}-*.zip" -exec cp '{}' artifacts/release/ \;
          python3 scripts/verify-release.py "$RELEASE_TAG" artifacts/release
          test -s "docs/releases/${RELEASE_TAG}.md"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --draft --title "before-you-do ${RELEASE_TAG}" --notes-file "docs/releases/${RELEASE_TAG}.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
